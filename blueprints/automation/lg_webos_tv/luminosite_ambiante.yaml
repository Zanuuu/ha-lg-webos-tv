blueprint:
  name: LG webOS TV — luminosité OLED selon la lumière ambiante
  description: >-
    Règle la luminosité des pixels OLED du téléviseur d'après un capteur de
    luminosité ambiante (lux), sur une échelle logarithmique proche de la
    perception de l'œil. Un réglage fait à la télécommande met
    l'automatisation en pause, jusqu'à la fin du délai choisi ou au prochain
    allumage du téléviseur. Les réglages d'image étant propres à chaque mode
    d'image, la valeur est réappliquée à chaque changement de mode ; les
    modes calibrés peuvent être laissés de côté.
  domain: automation
  source_url: https://raw.githubusercontent.com/Zanuuu/ha-lg-webos-tv/main/blueprints/automation/lg_webos_tv/luminosite_ambiante.yaml
  input:
    capteur_lux:
      name: Capteur de luminosité ambiante
      selector:
        entity:
          filter:
            domain: sensor
            device_class: illuminance
    luminosite:
      name: Luminosité des pixels OLED
      description: Entité « Luminosité des pixels OLED » de l'intégration.
      selector:
        entity:
          filter:
            integration: lg_webos_tv
            domain: number
    evenement:
      name: Réglage modifié sur le téléviseur
      description: Entité événement de l'intégration ; sert à détecter un réglage manuel.
      selector:
        entity:
          filter:
            integration: lg_webos_tv
            domain: event
    connexion:
      name: Connexion au téléviseur
      description: Capteur de connexion de l'intégration ; un nouvel allumage lève la pause.
      selector:
        entity:
          filter:
            integration: lg_webos_tv
            domain: binary_sensor
            device_class: connectivity
    lux_min:
      name: Pièce sombre (lux)
      description: En dessous, la luminosité minimale s'applique.
      default: 5
      selector:
        number: {min: 1, max: 1000, unit_of_measurement: lx, mode: box}
    lux_max:
      name: Pièce lumineuse (lux)
      description: Au-dessus, la luminosité maximale s'applique.
      default: 300
      selector:
        number: {min: 2, max: 100000, unit_of_measurement: lx, mode: box}
    luminosite_min:
      name: Luminosité minimale
      default: 40
      selector:
        number: {min: 0, max: 100}
    luminosite_max:
      name: Luminosité maximale
      default: 100
      selector:
        number: {min: 0, max: 100}
    ecart_minimal:
      name: Écart minimal
      description: Changement ignoré s'il est plus petit, pour ne pas suivre chaque frémissement du capteur.
      default: 3
      selector:
        number: {min: 1, max: 20}
    pause:
      name: Pause après un réglage manuel
      default: 120
      selector:
        number: {min: 5, max: 720, unit_of_measurement: min}
    modes_exclus:
      name: Modes d'image laissés de côté
      description: Modes où la luminosité n'est jamais modifiée (modes calibrés).
      default: [filmMaker, expert1, expert2]
      selector:
        select:
          multiple: true
          options:
            - {label: Image personnalisée, value: personalized}
            - {label: Vif, value: vivid}
            - {label: Standard, value: normal}
            - {label: Éco, value: eco}
            - {label: Accueil cinéma, value: hdrCinemaBright}
            - {label: Cinéma, value: cinema}
            - {label: Sport, value: sports}
            - {label: Optimiseur de jeu, value: game}
            - {label: FILMMAKER MODE, value: filmMaker}
            - {label: "Expert (pièce lumineuse, journée)", value: expert1}
            - {label: "Expert (pièce sombre, nuit)", value: expert2}

# Une nouvelle mesure annule le calcul en cours : seule la plus récente compte.
mode: restart

triggers:
  - trigger: state
    entity_id: !input capteur_lux
  - trigger: state
    entity_id: !input luminosite
    attribute: mode_image
  - trigger: state
    entity_id: !input connexion
    to: "on"

variables:
  luminosite: !input luminosite
  evenement: !input evenement
  connexion: !input connexion
  capteur_lux: !input capteur_lux
  lux_min: !input lux_min
  lux_max: !input lux_max
  luminosite_min: !input luminosite_min
  luminosite_max: !input luminosite_max
  ecart_minimal: !input ecart_minimal
  pause: !input pause
  modes_exclus: !input modes_exclus
  cible: >-
    {% set lux = [states(capteur_lux) | float(0), 1] | max %}
    {% set t = (log(lux) - log(lux_min)) / (log(lux_max) - log(lux_min)) %}
    {% set t = [[t, 0] | max, 1] | min %}
    {{ (luminosite_min + t * (luminosite_max - luminosite_min)) | round(0) | int }}

conditions:
  - condition: template
    alias: Téléviseur connecté et capteur valide
    value_template: >-
      {{ has_value(luminosite) and is_number(states(capteur_lux)) }}
  - condition: template
    alias: Mode d'image non exclu
    value_template: >-
      {{ state_attr(luminosite, 'mode_image') not in modes_exclus }}
  - condition: template
    alias: Pas de réglage manuel récent
    value_template: >-
      {% set instant = as_datetime(states(evenement)) %}
      {% if instant is none
            or state_attr(evenement, 'event_type') != 'manuel'
            or state_attr(evenement, 'cle') != 'backlight' %}
        true
      {% else %}
        {% set rallumage = states[connexion].last_changed
             if is_state(connexion, 'on') else none %}
        {{ now() > instant + timedelta(minutes=pause)
           or (rallumage is not none and rallumage > instant) }}
      {% endif %}
  - condition: template
    alias: Écart suffisant
    value_template: >-
      {{ (cible - states(luminosite) | float(0)) | abs >= ecart_minimal }}

actions:
  - action: number.set_value
    target:
      entity_id: !input luminosite
    data:
      value: "{{ cible }}"
