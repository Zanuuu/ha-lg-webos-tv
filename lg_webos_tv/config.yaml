name: LG webOS TV
version: "1.3.0"
slug: lg_webos_tv
description: Menu Réglages des téléviseurs LG webOS dans Home Assistant — réglages en temps réel, modification, presets, historique avec retour arrière.
url: https://github.com/Zanuuu/ha-lg-webos-tv
arch:
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8000
panel_title: LG webOS TV
panel_icon: mdi:television
# Port direct hors Ingress : désactivé par défaut, à mapper explicitement
# (et activer l'option acces_lan) pour un accès sans authentification HA.
ports:
  8000/tcp: null
webui: http://[HOST]:[PORT:8000]/
# lg_tv_host à null : option obligatoire, à renseigner avant le premier
# démarrage (aucune adresse par défaut ne vaut pour toutes les installations).
options:
  lg_tv_host: null
  acces_lan: false
schema:
  lg_tv_host: str
  acces_lan: bool
