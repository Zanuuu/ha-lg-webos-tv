configuration:
  lg_tv_host:
    name: Adresse du téléviseur
    description: >-
      Adresse IP du téléviseur LG sur le réseau local (par exemple
      192.168.1.50). Une adresse fixe (réservation DHCP) est recommandée.
  acces_lan:
    name: Accès direct sans authentification
    description: >-
      Autorise l'accès par le port 8000 sans passer par Home Assistant, donc
      sans authentification. À n'activer que si le port est aussi mappé dans
      la section Réseau.
network:
  8000/tcp: Accès direct sans Ingress (nécessite aussi l'option « Accès direct sans authentification »)
