name: LG webOS TV
version: "1.0.3"
slug: lg_settings
description: Réplique du menu Réglages du téléviseur LG OLED 65 G5 — consultation des réglages en temps réel, presets, historique.
arch:
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8000
panel_title: LG webOS TV
panel_icon: mdi:television
# Port direct hors Ingress : désactivé par défaut, à mapper explicitement
# (et activer l'option acces_lan) pour un accès sans authentification HA.
ports:
  8000/tcp: null
ports_description:
  8000/tcp: Accès direct sans Ingress (nécessite aussi l'option acces_lan)
webui: http://[HOST]:[PORT:8000]/
options:
  lg_tv_host: "192.168.1.50"
  acces_lan: false
schema:
  lg_tv_host: str
  acces_lan: bool
